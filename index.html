<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>葉奇昌 | Power BI 數據分析作品集</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght=300;400;500;700&family=Playfair+Display:ital,wght=0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                    },
                    colors: {
                        brand: {
                            beige: '#FDFBF7',
                            dark: '#2D2A26',
                            accent: '#8C7853',
                            accentLight: '#F3EFE6',
                            bi: '#F2C811'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #FDFBF7; }
        .premium-shadow-sm { box-shadow: 0 6px 20px -5px rgba(140, 120, 83, 0.08); }
    </style>
</head>
<body class="text-brand-dark min-h-screen selection:bg-brand-accent/20 selection:text-brand-accent flex flex-col">

    <header class="sticky top-0 z-40 bg-brand-beige/90 backdrop-blur-md border-b border-brand-accent/10">
        <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="https://jkes48822789-cmyk.github.io/Portfolio/" class="font-medium text-xs md:text-sm tracking-wider text-stone-600 hover:text-brand-accent flex items-center gap-1.5 group transition-colors">
                <i class="fa-solid fa-arrow-left transition-transform group-hover:-translate-x-1"></i>
                <span>返回首頁</span>
            </a>
            <span class="font-bold text-xs md:text-sm tracking-[0.25em] text-brand-accent">POWER BI DASHBOARDS</span>
        </div>
    </header>

    <section class="max-w-4xl mx-auto px-6 pt-12 pb-8 text-center">
        <h1 class="text-3xl md:text-4xl font-bold tracking-tight mt-3 mb-2 font-serif text-brand-dark">數據視覺化演練</h1>
        <p class="text-stone-500 text-xs md:text-sm max-w-xl mx-auto leading-relaxed">
            運用 Power BI 進行資料建模、清洗與視覺化分析，將原始數據轉化為商業決策洞察。
        </p>
    </section>

    <main class="max-w-4xl mx-auto px-6 flex-grow mb-16 w-full">
        <div class="grid grid-cols-1 gap-8">
            
            <!-- 專案 1 -->
            <div class="bg-white rounded-2xl premium-shadow-sm border border-brand-accent/5 overflow-hidden group hover:shadow-lg transition-all duration-300">
                <div class="flex flex-col md:flex-row">
                    <div class="md:w-1/3 aspect-video bg-stone-100 relative flex items-center justify-center overflow-hidden">
                        <img src="https://jkes48822789-cmyk.github.io/PowerBi/Image/PowerBi001.png" alt="零售通路銷售業績報表" class="w-full h-full object-cover">
                    </div>
                    <div class="md:w-2/3 p-6">
                        <h3 class="font-bold text-base mt-0 mb-2">零售通路銷售業績動態報表</h3>
                        <p class="text-xs text-stone-500 leading-relaxed mb-4">運用 DAX 函數分析年度趨勢與 KPI 達成率，提供直覺的業績檢視視角。</p>
                        <div class="flex flex-wrap gap-1.5">
                            <span class="text-[9px] bg-stone-50 text-stone-600 px-2 py-0.5 rounded border border-stone-100">DAX Measure</span>
                            <span class="text-[9px] bg-stone-50 text-stone-600 px-2 py-0.5 rounded border border-stone-100">Trend Analysis</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 專案區塊下半部 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- 專案 2 -->
                <div class="bg-white rounded-2xl premium-shadow-sm border border-brand-accent/5 overflow-hidden hover:shadow-lg transition-all">
                    <div class="aspect-video bg-stone-100 relative overflow-hidden">
                        <img src="https://jkes48822789-cmyk.github.io/PowerBi/Image/PowerBi002.png" alt="倉儲庫存優化模型" class="w-full h-full object-cover">
                    </div>
                    <div class="p-5">
                        <h3 class="font-bold text-sm mb-1">倉儲庫存優化模型</h3>
                        <p class="text-[11px] text-stone-500 mb-4">資料清洗與星狀模型建構分析。</p>
                    </div>
                </div>
                <!-- 專案 3 -->
                <div class="bg-white rounded-2xl premium-shadow-sm border border-brand-accent/5 overflow-hidden hover:shadow-lg transition-all">
                    <div class="aspect-video bg-stone-100 relative overflow-hidden">
                        <img src="https://jkes48822789-cmyk.github.io/PowerBi/Image/PowerBi003.png" alt="客戶行為分析" class="w-full h-full object-cover">
                    </div>
                    <div class="p-5">
                        <h3 class="font-bold text-sm mb-1">客戶行為分析</h3>
                        <p class="text-[11px] text-stone-500 mb-4">透過分群技術識別高價值客群行為。</p>
                    </div>
                </div>
                <!-- 專案 4 -->
                <div class="bg-white rounded-2xl premium-shadow-sm border border-brand-accent/5 overflow-hidden hover:shadow-lg transition-all">
                    <div class="aspect-video bg-stone-100 relative overflow-hidden">
                        <img src="https://jkes48822789-cmyk.github.io/PowerBi/Image/PowerBi004.png" alt="財務預測儀表板" class="w-full h-full object-cover">
                    </div>
                    <div class="p-5">
                        <h3 class="font-bold text-sm mb-1">財務預測儀表板</h3>
                        <p class="text-[11px] text-stone-500 mb-4">預測模型與風險矩陣呈現。</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-stone-900 text-stone-400 py-8 text-center mt-auto">
        <div class="max-w-4xl mx-auto px-6 text-xs">
            <p>© 2026 Yee Chi-Chang. Power BI 資料分析空間</p>
        </div>
    </footer>
</body>
</html>
